<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jolkhabar - Food Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b6b;
            margin-top: 10px;
        }
        /* Robot Animation Styles */
        .robot-container {
            font-size: 60px;
            margin: 10px 0;
            animation: bounce 2s infinite ease-in-out;
        }
        .robot-hand {
            display: inline-block;
            animation: wave 1.2s infinite alternate;
            transform-origin: bottom right;
        }
        @keyframes wave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(35deg); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        /* Food Card Styles */
        .food-card {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fafafa;
        }
        img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Animated Robot Greeting -->
        <div class="robot-container">
            🤖<span class="robot-hand">👋</span>
        </div>

        <h1>Jolkhabar 🍲</h1>
        <p>Welcome to our delicious food corner!</p>

        <div class="food-card">
            <img src="Chowmin.jpg" alt="Charming Chowmein">
            <h3>Charming Chowmein</h3>
        </div>

        <div class="food-card">
            <img src="Paratha.jpg" alt="Rules of Paratha">
            <h3>Rules of Paratha</h3>
        </div>
    </div>

</body>
</html>
