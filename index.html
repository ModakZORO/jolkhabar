<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jolkhabar - Food Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b6b;
            margin-top: 10px;
        }
        /* Bodybuilder Robot Animation */
        .robot-box {
            font-size: 70px;
            margin: 15px 0;
            display: inline-block;
            animation: bodybuilderFlex 1.2s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }
        @keyframes bodybuilderFlex {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(-5deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }
        .tagline {
            font-style: italic;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 15px;
        }
        /* Food Card Styles */
        .food-card {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fafafa;
        }
        img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Flexing Bodybuilder Robot -->
        <div class="robot-box">🤖</div>
        <div class="tagline">"Built strong, serving fresh!"</div>

        <h1>Jolkhabar 🍲</h1>
        <p>Welcome to our delicious food corner!</p>

        <div class="food-card">
            <!-- Using lowercase 'chowmin.jpg' to ensure it matches your file -->
            <img src="chowmin.jpg" alt="Charming Chowmein" onerror="this.src='Chowmin.jpg';">
            <h3>Charming Chowmein</h3>
        </div>

        <div class="food-card">
            <img src="Paratha.jpg" alt="Rules of Paratha">
            <h3>Rules of Paratha</h3>
        </div>
    </div>

</body>
</html>
