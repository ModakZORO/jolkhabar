<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Subdomain</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.1rem; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #4ade80;
            color: #065f46;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello World! 👋</h1>
        <p>This live website is running code from GitHub, hosted seamlessly, and connected via Cloudflare to your free DigitalPlat subdomain!</p>
        <div class="badge">Successfully Connected</div>
    </div>
</body>
  </html>
