<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jolkhabar - Food Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b6b;
            margin-top: 10px;
        }
        /* Bodybuilder Romeo Robot Animations */
        .robot-container {
            font-size: 55px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .flex-muscle {
            display: inline-block;
            animation: flexMuscle 1.5s infinite alternate ease-in-out;
        }
        .romeo-kiss {
            display: inline-block;
            animation: blowKiss 2s infinite ease-in-out;
            transform-origin: bottom left;
        }
        @keyframes flexMuscle {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.25) rotate(-10deg); }
        }
        @keyframes blowKiss {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-12px) scale(1.3); opacity: 1; }
        }
        .tagline {
            font-style: italic;
            color: #e84393;
            font-weight: bold;
            margin-bottom: 20px;
        }
        /* Food Card Styles */
        .food-card {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fafafa;
        }
        img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bodybuilder Romeo Robot Animation -->
        <div class="robot-container">
            <span class="flex-muscle">🦾</span>
            <span>🤖</span>
            <span class="flex-muscle">🦾</span>
            <span class="romeo-kiss">💋</span>
        </div>
        
        <div class="tagline">"So irresistible, it'll make your heart race!"</div>

        <h1>Jolkhabar 🍲</h1>
        <p>Welcome to our delicious food corner!</p>

        <div class="food-card">
            <!-- Ensure your image filename in GitHub matches: chowmin.jpg or Chowmin.jpg -->
            <img src="Chowmin.jpg" alt="Charming Chowmein">
            <h3>Charming Chowmein</h3>
        </div>

        <div class="food-card">
            <img src="Paratha.jpg" alt="Rules of Paratha">
            <h3>Rules of Paratha</h3>
        </div>
    </div>

</body>
</html>
